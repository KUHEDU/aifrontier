<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C2B3F">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI프론티어">
<title>AI프론티어 팀 기록</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C2B3F'/%3E%3Cpath d='M17 42 30 20 47 36' fill='none' stroke='%235AA9FF' stroke-width='3'/%3E%3Ccircle cx='17' cy='42' r='6' fill='%235AA9FF'/%3E%3Ccircle cx='30' cy='20' r='6' fill='%235AA9FF'/%3E%3Ccircle cx='47' cy='36' r='6' fill='%235AA9FF'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --navy:#0C2B3F; --navy2:#16405C; --blue:#1F64DC; --blue-press:#1853B8; --sky:#5AA9FF;
  --paper:#F2F5F8; --card:#fff; --ink:#0F1E2B; --slate:#5B6B7C; --mute:#8592A0; --line:#DCE3EA; --line2:#EBF0F4;
  --ok:#0F7A54; --ok-bg:#E2F3EB; --warn:#9A5A08; --warn-bg:#FCEFD9; --wait:#34557D; --wait-bg:#E6EDF6;
  --danger:#C23434; --danger-bg:#FBE8E8;
  --r-sheet:20px; --r-btn:14px; --r-field:12px; --r-thumb:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num,.amt{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 진행 표시 */
#busy{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s}
#busy.on{opacity:1}
#busy i{position:absolute;top:0;bottom:0;width:40%;background:var(--sky);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{from{left:-40%}to{left:100%}}

/* 남색 띠 — 팀 정체성 */
.band{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 44px}
.band::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(90,169,255,.22) 1.3px,transparent 1.5px);background-size:18px 18px;-webkit-mask-image:linear-gradient(105deg,transparent 35%,#000 90%);mask-image:linear-gradient(105deg,transparent 35%,#000 90%)}
.band>*{position:relative}
.band-top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.course{font-size:14px;font-weight:600;color:rgba(255,255,255,.72)}
.icon-btn{border:0;background:transparent;color:inherit;width:44px;height:44px;margin-right:-10px;border-radius:12px;display:grid;place-items:center}
.icon-btn:active{background:rgba(255,255,255,.12)}
.team-name{margin:14px 0 0;font-size:36px;line-height:1.1;font-weight:760;letter-spacing:-.02em}
.team-proj{margin:6px 0 0;font-size:16px;color:var(--sky);font-weight:600}
.stars{display:block;margin:18px 0 4px;width:100%;max-width:300px;height:44px;overflow:visible}
.study-line{margin:0;font-size:14px;color:rgba(255,255,255,.78)}
.study-line b{color:#fff;font-weight:700}
.budget{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.budget-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.budget-row span{font-size:14px;color:rgba(255,255,255,.72)}
.budget-row strong{font-size:26px;font-weight:720;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.budget-row strong.over{color:#FF9C9C}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.16);margin:10px 0 8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--sky)}
.meter.over i{background:#FF8A8A}
.budget-sub{font-size:13px;color:rgba(255,255,255,.66);font-variant-numeric:tabular-nums}

/* 큰 버튼 — 띠 아래 걸침 */
.actions{display:grid;grid-template-columns:1fr;gap:10px;padding:0 16px;margin-top:-30px;position:relative;z-index:2}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:62px;padding:8px 16px;border-radius:var(--r-btn);border:1px solid var(--line);background:#fff;color:var(--blue);font-size:17px;font-weight:680;box-shadow:0 6px 18px rgba(12,43,63,.12)}
.big .big-l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;text-align:left}
.big .big-l small{font-size:13px;font-weight:550;opacity:.8}
.big.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.big:active{transform:translateY(1px)}
.big.primary:active{background:var(--blue-press)}
.big svg{flex:none}

.notice{margin:14px 16px 0;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:15px;font-weight:600;border:0;display:flex;gap:10px;align-items:center;width:calc(100% - 32px);text-align:left}
.notice.info{background:var(--wait-bg);color:var(--wait)}
.notice.err{background:var(--danger-bg);color:var(--danger)}
.notice .grow{flex:1}

/* 탭 */
.tabs{display:flex;gap:6px;margin:18px 16px 0;padding:4px;background:#E4EAF0;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;height:40px;border-radius:9px;font-size:15px;font-weight:600;color:var(--slate)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(12,43,63,.12)}
.tabs .cnt{font-weight:500;color:var(--mute);margin-left:4px;font-variant-numeric:tabular-nums}

/* 목록 */
.list{margin:12px 16px 32px;background:#fff;border-radius:16px;border:1px solid var(--line2);overflow:hidden}
.list-h{padding:14px 16px 6px;font-size:13px;color:var(--mute);font-weight:600}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-top:1px solid var(--line2);background:#fff;text-align:left}
.list .row:first-child,.list-h+.row{border-top:0}
.row:active{background:#F5F8FB}
.row-date{flex:none;width:54px;text-align:center;line-height:1.15;white-space:nowrap}
.row-date b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.row-date span{font-size:12px;color:var(--mute)}
.row-main{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:650;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-meta{margin-top:3px;font-size:13px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row-end .amt{font-size:16px;font-weight:700}
.thumb{flex:none;width:52px;height:52px;border-radius:var(--r-thumb);background:#E9EEF3 center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:11px;font-weight:700;overflow:hidden}
.empty{padding:34px 20px;text-align:center;color:var(--slate);font-size:15px}
.empty p{margin:0 0 14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:6px;vertical-align:2px;background:#EEF2F6;color:var(--slate)}
.tag.study{background:#E3EEFF;color:var(--blue)}
.tag.team{background:var(--navy);color:#fff}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-제출{background:var(--wait-bg);color:var(--wait)}
.p-확인{background:var(--ok-bg);color:var(--ok)}
.p-보완요청{background:var(--warn-bg);color:var(--warn)}

/* 시트(아래에서 올라오는 창) */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(9,25,38,.48);opacity:0;transition:opacity .22s}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;background:var(--paper);border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.full .sheet{height:100vh;height:100dvh;max-height:none;border-radius:0}
.sheet-wrap.open .sheet{transform:none}
.sheet-wrap.open .sheet-bg{opacity:1}
@media (min-width:640px){
  .sheet-wrap{align-items:center}
  .sheet,.sheet-wrap.full .sheet{height:auto;max-height:90vh;border-radius:var(--r-sheet)}
}
.sh-head{flex:none;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 8px 10px 20px;background:#fff;border-bottom:1px solid var(--line2);border-radius:inherit}
.sheet-wrap:not(.full) .sh-head{padding-top:12px}
.sh-head h2{flex:1;margin:0;font-size:18px;font-weight:720}
.sh-head .icon-btn{margin:0;color:var(--slate)}
.sh-head .icon-btn:active{background:#EEF2F6}
.sh-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 28px;overscroll-behavior:contain}
.sh-foot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line2)}
.sh-foot .err-msg{margin:0 0 10px;color:var(--danger);font-size:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;white-space:nowrap;text-decoration:none;border-radius:var(--r-btn);border:1px solid var(--line);background:#fff;font-size:16px;font-weight:650;color:var(--ink)}
.btn.block{display:flex;width:100%;height:54px;font-size:17px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:active{background:var(--blue-press)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:#fff;border-color:#E6C48D;color:var(--warn)}
.btn.danger{color:var(--danger);border-color:#EBC3C3}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn[disabled]{opacity:.55;cursor:default}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}

/* 입력 */
.field{margin:0 0 18px}
.field>label,.field>.lbl{display:block;margin:0 0 7px;font-size:14px;font-weight:650;color:var(--slate)}
.field .req{color:var(--blue);margin-left:3px}
.field .hint{margin:6px 0 0;font-size:13px;color:var(--mute)}
.in{width:100%;min-height:50px;padding:12px 14px;font-size:17px;border:1px solid var(--line);border-radius:var(--r-field);background:#fff;-webkit-appearance:none;appearance:none}
textarea.in{min-height:110px;resize:vertical;line-height:1.55}
.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,100,220,.16)}
.in.amount{font-size:26px;font-weight:720;font-variant-numeric:tabular-nums;text-align:right;padding-right:44px}
.amount-wrap{position:relative}
.amount-wrap::after{content:"원";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:650;color:var(--slate)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{margin-top:8px;font-size:14px;color:var(--blue);font-weight:650}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.add{border-style:dashed;color:var(--blue)}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add .in{flex:1;min-width:0;min-height:44px;font-size:16px}
.inline-add .btn{flex:none;height:44px}

/* 사진 */
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:var(--r-thumb);background:#E9EEF3 center/cover no-repeat;overflow:hidden;border:0;padding:0}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(9,25,38,.72);color:#fff;font-size:16px;line-height:28px}
.ph .pdf{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--danger);font-size:14px}
.ph-add{aspect-ratio:1;border-radius:var(--r-thumb);border:1.5px dashed #AFC0D2;background:#fff;color:var(--blue);font-size:13px;font-weight:650;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cam-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cam-row .btn{height:56px}

/* 상세 */
.d-amount{font-size:32px;font-weight:760;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:0}
.d-title{font-size:21px;font-weight:720;margin:2px 0 0;line-height:1.35}
.d-sub{margin:6px 0 0;color:var(--slate);font-size:15px}
.kv{margin:18px 0 0;background:#fff;border:1px solid var(--line2);border-radius:14px;padding:4px 16px}
.kv div{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line2);font-size:15px}
.kv div:first-child{border-top:0}
.kv dt{flex:none;width:76px;color:var(--mute);font-weight:600}
.kv dd{margin:0;flex:1;white-space:pre-wrap}
.block{margin:18px 0 0}
.block h3{margin:0 0 8px;font-size:14px;color:var(--slate);font-weight:700}
.block .txt{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:14px 16px;white-space:pre-wrap;font-size:16px;line-height:1.65}
.full-img{display:block;width:100%;border-radius:12px;background:#E9EEF3;min-height:120px;margin-bottom:10px;border:1px solid var(--line2)}
.loading-img{display:grid;place-items:center;height:180px;border-radius:12px;background:#E9EEF3;color:var(--slate);font-size:14px;margin-bottom:10px}
.status-box{margin:16px 0 0;padding:12px 14px;border-radius:12px;font-size:15px}
.status-box.s-제출{background:var(--wait-bg);color:var(--wait)}
.status-box.s-확인{background:var(--ok-bg);color:var(--ok)}
.status-box.s-보완요청{background:var(--warn-bg);color:var(--warn)}
.status-box b{display:block;margin-bottom:2px}

/* 활동 기록에 붙인 영수증 */
.sec-h{margin:22px 20px 0;font-size:15px;font-weight:700;color:var(--slate)}
.sec-h .cnt{font-weight:500;color:var(--mute);margin-left:4px;font-variant-numeric:tabular-nums}
.rc-list{margin:0}
.rc-row .thumb.none{background:var(--danger-bg);color:var(--danger)}
.rc-add{justify-content:center;gap:8px;min-height:56px;color:var(--blue);font-size:16px;font-weight:680}
.rc-add svg{flex:none}
.p-new{background:#E3EEFF;color:var(--blue)}
.rc-card{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rc-amt{font-size:19px;font-weight:760;font-variant-numeric:tabular-nums;margin-right:6px}
.rc-store{font-size:16px;font-weight:650}
.rc-meta{margin:4px 0 0;font-size:14px;color:var(--slate)}
.rc-meta.miss{color:var(--danger);font-weight:600}
.rc-card .photos{margin-top:10px}
.rc-card .status-box{margin-top:10px}
.rv{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);display:grid;gap:8px}
.rv .in{min-height:44px;font-size:16px}

/* 사진 크게 보기 */
#viewer{position:fixed;inset:0;z-index:70;background:#05121C;display:flex;flex-direction:column}
#viewer .v-top{display:flex;justify-content:space-between;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 8px 6px 16px;color:#fff;font-size:14px}
#viewer .v-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
#viewer img{max-width:100%;height:auto;margin:auto}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.noscroll #toast{bottom:calc(96px + env(safe-area-inset-bottom))}

/* 첫 화면·설정 */
.intro{padding:calc(28px + env(safe-area-inset-top)) 22px 40px}
.intro h1{margin:18px 0 8px;font-size:30px;line-height:1.2;font-weight:760;letter-spacing:-.02em}
.intro .lead{margin:0 0 22px;color:var(--slate);font-size:16px}
.panel{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:18px;margin:0 0 14px}
.panel h2{margin:0 0 6px;font-size:17px}
.panel p{margin:0 0 12px;color:var(--slate);font-size:15px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 40px;counter-increment:s;font-size:15px;color:var(--ink)}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.steps li>b{display:block;font-size:16px;margin-bottom:3px}
.steps li p{margin:4px 0 8px;color:var(--slate)}
.code-big{font-size:40px;font-weight:780;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-align:center;padding:14px;border-radius:14px;background:var(--navy);color:#fff;margin:10px 0}
.team-pick{display:grid;gap:8px;margin-bottom:14px}
.team-pick label{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:650}
.team-pick input{width:20px;height:20px;accent-color:var(--blue)}
.team-pick .tp-body{display:flex;flex-direction:column;gap:1px;min-width:0}
.team-pick .tp-line{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px}
.team-pick .tp-mem{color:var(--slate);font-weight:500;font-size:15px}
.team-pick small{color:var(--mute);font-weight:500;font-size:13px}
.mark{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:15px}

/* 관리자 */
.admin-band{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 20px 0;position:relative;overflow:hidden}
.admin-band::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(90,169,255,.2) 1.3px,transparent 1.5px);background-size:18px 18px;-webkit-mask-image:linear-gradient(100deg,transparent 45%,#000 95%);mask-image:linear-gradient(100deg,transparent 45%,#000 95%)}
.admin-band>*{position:relative}
.admin-band h1{margin:6px 0 14px;font-size:24px;font-weight:740}
.atabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.atabs button{flex:none;border:0;background:transparent;color:rgba(255,255,255,.7);height:46px;padding:0 14px;font-size:15px;font-weight:650;border-bottom:3px solid transparent}
.atabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--sky)}
.atabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--sky);color:var(--navy);font-size:12px;font-weight:800;line-height:20px}
.admin-main{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tools .btn{height:42px;font-size:15px}
.tline{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(160px,1.2fr) minmax(200px,1.6fr) 110px;gap:16px;align-items:center;padding:16px;border-top:1px solid var(--line2);background:#fff;width:100%;border-left:0;border-right:0;border-bottom:0;text-align:left}
.tline:first-child{border-top:0}
.tline .tn{font-size:18px;font-weight:740}

function hoursText(h) {

const ICON = {

/* 자율스터디 별자리: 목표 횟수만큼 점, 기록한 만큼 불이 켜진다 */
function stars(n, goal, mini) {
  goal = Math.max(1, Math.min(12, Number(goal) || 5));
  const W = mini ? 120 : 300, H = mini ? 26 : 44, pad = mini ? 7 : 12;
  const step = goal > 1 ? (W - pad * 2) / (goal - 1) : 0;
  const pts = [];
  for (let i = 0; i < goal; i++) pts.push([pad + i * step, H / 2 + (i % 2 ? -1 : 1) * (mini ? 4 : 7)]);
  const lit = mini ? '#1F64DC' : '#5AA9FF', dim = mini ? '#C5D2DE' : 'rgba(255,255,255,.3)';
  let s = '';
  for (let i = 1; i < goal; i++) {
    const on = i < n;
    s += `<line x1="${pts[i - 1][0]}" y1="${pts[i - 1][1]}" x2="${pts[i][0]}" y2="${pts[i][1]}" stroke="${on ? lit : dim}" stroke-width="${on ? 1.6 : 1.2}" ${on ? '' : 'stroke-dasharray="2 4"'}/>`;
  }
  pts.forEach((p, i) => {
    if (i < n) {
      s += mini ? `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${lit}"/>`
        : `<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="${lit}" opacity=".16"/><circle cx="${p[0]}" cy="${p[1]}" r="6.5" fill="none" stroke="${lit}" stroke-width="1.4"/><circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="${lit}"/>`;
    } else {
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="${mini ? 3 : 3.4}" fill="${dim}"/>`;
    }
  });
  if (n > goal) s += `<text x="${W + (mini ? 6 : 10)}" y="${H / 2 + 5}" font-size="${mini ? 12 : 15}" font-weight="700" fill="${lit}">+${n - goal}</text>`;
  return `<svg class="${mini ? 'stars-mini' : 'stars'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="자율스터디 ${n}회 기록, 목표 ${goal}회">${s}</svg>`;
}

/* ───────── 서버 연결 ───────── */
class AppErr extends Error { constructor(code, msg) { super(msg); this.code = code; } }
class NetErr extends Error {}
async function api(action, payload, opt) {
  opt = opt || {};
  if (!st.api) throw new NetErr('연결된 서버 주소가 없습니다.');
  const body = JSON.stringify(Object.assign({ action: action, auth: opt.noAuth ? undefined : st.auth }, payload || {}));
  const tries = opt.tries || 3;
  let lastErr;
  for (let i = 0; i < tries; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), opt.timeout || 60000);
    try {
      const res = await fetch(st.api, { method: 'POST', body: body, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (!res.ok) throw new NetErr('서버 응답 ' + res.status);
      const txt = await res.text();
      let j;
      try { j = JSON.parse(txt); } catch (e) { throw new NetErr('서버가 예상과 다른 응답을 보냈습니다.'); }
      if (!j.ok) throw new AppErr(j.error, j.message || '요청을 처리하지 못했습니다.');
      return j;
    } catch (e) {
      clearTimeout(timer);
      if (e instanceof AppErr) throw e;
      lastErr = e;
      if (i < tries - 1) await sleep(1500 * (i + 1));
    }
  }
  const msg = lastErr && lastErr.name === 'AbortError' ? '서버 응답이 너무 늦습니다.' : '서버에 연결하지 못했습니다.';
  throw new NetErr(msg + ' 인터넷 연결을 확인하고 다시 시도해 주세요.');
}
function apiFromLink(h) {

  if (h.get('api') && /^https?:\/\//.test(h.get('api'))) return h.get('api');

}

/* ───────── 시트(창) ───────── */
const sheets = [];

  $('#sheets').appendChild(w);

// 창 닫기는 브라우저 뒤로 가기와 같은 길로 한다(휴대폰 뒤로 버튼으로도 닫히게). 다 닫힌 뒤에 끝나는 약속을 돌려준다.

function closeSheets(n) {
  return new Promise((resolve) => {
    n = Math.min(n, sheets.length);
    if (!n) { resolve(); return; }
    const target = sheets.length - n;

  });
}

  return `<div class="sh-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="closeSheet" aria-label="${back ? '뒤로' : '닫기'}">${ICON.close}</button></div>`;
}

function D() { return st.data || { acts: [], rcps: [], files: [], teams: [], settings: {} }; }

const safeImg = (u) => (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u || '') ? u : '');
function teamStats(id) {
  const d = D();
  const t = teamOf(id) || { budget: 0 };
  const acts = d.acts.filter((a) => a.team === id);
  const rcps = d.rcps.filter((r) => r.team === id);
  const study = acts.filter((a) => a.type === '자율스터디');
  const spent = sum(rcps.map((r) => r.amount));
  return {
    acts: acts, rcps: rcps, study: study, spent: spent, budget: Number(t.budget) || 0, remain: (Number(t.budget) || 0) - spent,
    okAmt: sum(rcps.filter((r) => r.status === '확인').map((r) => r.amount)),
    wait: rcps.filter((r) => r.status === '제출').length, fix: rcps.filter((r) => r.status === '보완요청').length,
    hours: sum(acts.map((a) => a.hours)), studyHours: sum(study.map((a) => a.hours))
  };
}
function attendance(id) {
  const m = new Map();
  D().acts.filter((a) => a.team === id && a.type === '자율스터디').forEach((a) => {
    (a.attendees || []).forEach((n) => { const e = m.get(n) || { name: n, count: 0, hours: 0 }; e.count++; e.hours += Number(a.hours) || 0; m.set(n, e); });
  });
  const t = teamOf(id);
  ((t && t.members) || []).forEach((n) => { if (!m.has(n)) m.set(n, { name: n, count: 0, hours: 0 }); });
  return [...m.values()].sort((a, b) => b.hours - a.hours || a.name.localeCompare(b.name, 'ko'));
}
const byDateDesc = (a, b) => (b.date + (b.start || '') + b.created).localeCompare(a.date + (a.start || '') + a.created);
// 활동에 붙은 영수증(붙인 순서)
function rcpsOf(actId) { return D().rcps.filter((r) => r.actId === actId).sort((a, b) => String(a.created || '').localeCompare(String(b.created || ''))); }
// 영수증 여러 건의 대표 상태: 보완 요청 > 확인 대기 > 확인 완료
function rcpState(rcs) { return !rcs.length ? '' : rcs.some((r) => r.status === '보완요청') ? '보완요청' : rcs.some((r) => r.status === '제출') ? '제출' : '확인'; }
function upsert(arr, obj) { const i = arr.findIndex((x) => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); }
function setFiles(owner, files) { const d = D(); d.files = d.files.filter((f) => f.owner !== owner).concat(files || []); }
function saveCache() {
  if (!st.data) return;
  try { const s = JSON.stringify({ key: JSON.stringify(st.auth), data: st.data }); if (s.length < 2500000) localStorage.setItem(LS.cache, s); else localStorage.removeItem(LS.cache); }
  catch (e) { try { localStorage.removeItem(LS.cache); } catch (e2) { /* 무시 */ } }
}

async function refresh(quiet) {
  const key = JSON.stringify(st.auth);
  busy(true);
  const slow = setTimeout(() => { if (!quiet) toast('구글 서버 응답을 기다리는 중입니다. 가끔 30초쯤 걸립니다.', 5000); }, 9000);
  try {
    const d = await api('load');
    if (key !== JSON.stringify(st.auth)) return; // 그새 다른 팀 링크로 바뀜
    st.data = d; st.lastErr = '';
    saveCache();
    rerenderSheets();
  } catch (e) {
    if (key !== JSON.stringify(st.auth)) return;
    if (e instanceof AppErr && (e.code === 'auth' || e.code === 'auth_admin')) { logout(e.message); return; }
    st.lastErr = e.message;
    if (!st.data) { renderError(e.message); return; }
    toast(e.message, 4000);
  } finally { clearTimeout(slow); busy(false); }
  render();
}
function logout(msg) {
  st.auth = null; st.data = null;
  lsSet(LS.auth, null); lsSet(LS.cache, null);
  closeAll();
  renderLogin(msg);
}

/* ───── 사진 처리 ───── */
function readAsDataURL(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); }); }
function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
function scaled(img, maxEdge, q) {
  const w0 = img.naturalWidth, h0 = img.naturalHeight;
  const k = Math.min(1, maxEdge / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function prepFile(file) {
  const id = rid('f');
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  if (isPdf) {
    if (file.size > 9e6) throw new Error('PDF가 너무 큽니다(9MB 이하).');
    const url = await readAsDataURL(file);
    return { id: id, isNew: true, mime: 'application/pdf', name: file.name, data: url.split(',')[1], thumb: '', pdf: true };
  }
  try {
    const img = await loadImg(file);
    let full = scaled(img, 2000, 0.85);
    if (full.length > 2600000) full = scaled(img, 1600, 0.8);
    let thumb = scaled(img, 240, 0.72);
    if (thumb.length > 40000) thumb = scaled(img, 160, 0.6);
    return { id: id, isNew: true, mime: 'image/jpeg', name: file.name || 'photo.jpg', data: full.split(',')[1], thumb: thumb, fullUrl: full };
  } catch (e) {
    if (file.size > 9e6) throw new Error('사진을 읽을 수 없습니다. 다른 사진을 골라 주세요.');
    const url = await readAsDataURL(file);
    const mime = /^image\//.test(file.type) ? file.type : 'image/jpeg';
    return { id: id, isNew: true, mime: mime, name: file.name || 'photo', data: url.split(',')[1], thumb: '' };
  }
}
// 사진 고르기는 <label for> 로 연다(카카오톡 등 인앱 브라우저에서도 스크립트 없이 열림)
async function onPicked(e) {

function formErr(msg) { const e = fq('#form-err'); if (!e) { if (msg) toast(msg); return; } e.textContent = msg; e.classList.toggle('hidden', !msg); }
function setSaving(on, label) { const b = fq('#save-btn'); if (!b) return; b.disabled = on; if (on) { b.dataset.label = b.dataset.label || b.textContent; b.textContent = label; } else if (b.dataset.label) b.textContent = b.dataset.label; }

const rcpChanged = (r) => r.isNew || r.dirty || r.files.some((x) => x.isNew) || r.remove.length > 0;
// 저장 순서: 활동 → 새로 붙이거나 고친 영수증 → 뺀 영수증. 하나씩 보내고 끝난 것은 표시해 두므로 중간에 끊겨도 다시 누르면 남은 것만 이어서 보낸다
async function saveAct() {
  const f = st.form;
  if (!f || f.kind !== 'act') return;
  if (!f.date) { formErr('날짜를 넣어 주세요.'); return; }
  if (!f.topic.trim()) { formErr('주제를 한 줄로 적어 주세요.'); fq('#a-topic').focus(); return; }
  formErr('');
  const todo = f.rcps.filter(rcpChanged);
  const noPhoto = todo.filter((r) => !r.files.length).length;
  if (noPhoto && !(await ask(`사진 없는 영수증이 ${noPhoto}건 있습니다. 그대로 저장할까요? 사진은 나중에 수정에서 붙일 수 있습니다.`, '그대로 저장'))) return;
  if (st.form !== f) return;
  if (f.writer) lsSet(LS.me, f.writer);
  const nf = f.files.filter((x) => x.isNew);
  setSaving(true, nf.length ? '사진 올리는 중…' : '저장 중…');
  try {
    const r = await api('saveAct', {
      act: { id: f.id, team: f.team, type: f.type, date: f.date, start: f.start, end: f.end, place: f.place, attendees: f.attendees, topic: f.topic, content: f.content, next: f.next, writer: f.writer },
      newFiles: nf.map((x) => ({ id: x.id, mime: x.mime, name: x.name, data: x.data, thumb: x.thumb })), removeFiles: f.remove
    }, { timeout: nf.length ? 150000 : 60000 });
    nf.forEach((x) => { if (x.fullUrl) st.full.set(x.id, x.fullUrl); });
    upsert(D().acts, r.act); setFiles('A:' + r.act.id, r.files);
    f.id = r.act.id; f.files = r.files.map((x) => Object.assign({}, x, { isNew: false })); f.remove = [];
    for (let i = 0; i < todo.length; i++) {
      const rc = todo[i], rf = rc.files.filter((x) => x.isNew);
      setSaving(true, '영수증 ' + (todo.length > 1 ? (i + 1) + '/' + todo.length + ' ' : '') + (rf.length ? '사진 올리는 중…' : '저장 중…'));
      const rr = await api('saveRcp', {
        rcp: { id: rc.id, team: f.team, actId: f.id, date: rc.dateAuto ? f.date : rc.date, amount: Number(rc.amount), store: rc.store, category: rc.category, item: rc.item, payer: rc.payer, method: rc.method, memo: rc.memo, writer: rc.writer || f.writer },
        newFiles: rf.map((x) => ({ id: x.id, mime: x.mime, name: x.name, data: x.data, thumb: x.thumb })), removeFiles: rc.remove
      }, { timeout: rf.length ? 150000 : 60000 });
      rf.forEach((x) => { if (x.fullUrl) st.full.set(x.id, x.fullUrl); });
      upsert(D().rcps, rr.rcp); setFiles('R:' + rr.rcp.id, rr.files);
      Object.assign(rc, { isNew: false, dirty: false, dateAuto: false, date: rr.rcp.date, status: rr.rcp.status, reviewNote: rr.rcp.reviewNote || '', writer: rr.rcp.writer || '',
        files: rr.files.map((x) => Object.assign({}, x, { isNew: false })), remove: [] });
    }
    for (const id of f.removeRcps.slice()) {
      setSaving(true, '뺀 영수증 지우는 중…');
      await api('deleteRcp', { id: id });
      D().rcps = D().rcps.filter((x) => x.id !== id); setFiles('R:' + id, []);
      f.removeRcps = f.removeRcps.filter((x) => x !== id);
    }
    if (f.isNew) lsSet(LS.dAct, null);
    saveCache();
    const wasNew = f.isNew, n = todo.length;
    await closeAll();
    if (D().role === 'team') st.tab = 'acts';
    render();
    toast((wasNew ? '활동 기록을 저장했습니다' : '수정 내용을 저장했습니다') + (n ? ' (영수증 ' + n + '건 제출)' : ''));
  } catch (e) {
    saveCache(); render(); // 이미 저장된 것은 목록에 보이게
    setSaving(false);
    if (e instanceof AppErr && e.code === 'auth') { logout(e.message); return; }
    formErr(e.message + (e instanceof NetErr ? ' 입력한 내용과 사진은 그대로 있으니 다시 저장을 눌러 주세요.' : ''));
  }
}

function applySubRcp() {
  const f = st.form;
  if (!f || f.kind !== 'rcp') return;
  const amount = Number(String(f.amount).replace(/\D/g, ''));
  if (!amount) { formErr('금액을 넣어 주세요.'); fq('#r-amount').focus(); return; }
  if (!f.date) { formErr('사용일을 넣어 주세요.'); return; }
  if (!f.store.trim()) { formErr('사용처(가게 이름)를 적어 주세요.'); fq('#r-store').focus(); return; }
  const r = {};
  Object.keys(f).forEach((k) => { if (!['kind', 'parent', 'idx', 'team', 'el'].includes(k)) r[k] = f[k]; });
  r.amount = String(amount); r.dirty = true;
  if (f.idx >= 0) f.parent.rcps[f.idx] = r; else f.parent.rcps.push(r);
  closeSheet();
}
async function dropSubRcp() {
  const f = st.form;
  if (!f || f.kind !== 'rcp') return;
  if (!(await ask('이 영수증을 기록에서 뺄까요? 기록을 저장하면 영수증과 사진이 지워집니다.', '빼기', true))) return;

}

async function getFull(id) {
  if (st.full.has(id)) return st.full.get(id);
  const r = await api('getFile', { id: id }, { timeout: 90000 });
  const bin = atob(r.data); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([u8], { type: r.mime }));
  st.full.set(id, url);
  return url;
}
async function viewPhoto(id) {

  document.body.appendChild(v);
  history.pushState({ sheet: sheets.length, viewer: 1 }, '');
  try {

  } catch (e) { if (v.isConnected) $('.v-body', v).innerHTML = `<p style="color:#fff;padding:24px">${esc(e.message)}</p>`; }
}

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true); lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true); lh.set(nb, 30);

    sh.widths.forEach((wd, i) => { s += `<col min="${i + 1}" max="${i + 1}" width="${wd}" customWidth="1"/>`; });
    s += '</cols><sheetData>';
    sh.rows.forEach((row, ri) => {

  const root = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';

function exportXlsx() {

  d.teams.forEach((t) => { const s = teamStats(t.id); sumRows.push([t.name, t.project, s.budget, s.spent, s.remain, s.okAmt, s.rcps.length, s.wait, s.fix, s.acts.length, s.study.length, Math.round(s.hours * 100) / 100]); });
  const actOf = new Map(d.acts.map((a) => [a.id, a]));
  const actDate = (r) => (actOf.get(r.actId) || {}).date || '';
  const rcRows = [['팀', '활동 날짜', '활동 주제', '사용일', '사용처', '분류', '산 것', '금액', '결제한 사람', '결제 수단', '상태', '교육팀 메모', '작성자', '제출 시각', '사진 수', '메모']];
  d.rcps.slice().sort((a, b) => (teamOrder.get(a.team) - teamOrder.get(b.team)) || actDate(a).localeCompare(actDate(b)) || a.date.localeCompare(b.date)).forEach((r) => {
    const a = actOf.get(r.actId) || {};
    rcRows.push([teamName(r.team), a.date || '', a.topic || '', r.date, r.store, r.category, r.item, r.amount, r.payer, r.method, STATUS_LABEL[r.status] || r.status, r.reviewNote, r.writer, r.created, filesOf('R:' + r.id).length, r.memo]);
  });
  const acRows = [['팀', '날짜', '유형', '시작', '종료', '시간', '장소', '참석자', '참석 인원', '주제', '논의한 내용', '다음에 할 일', '작성자', '사진 수', '영수증 수', '영수증 금액']];
  d.acts.slice().sort(sortT).forEach((a) => {
    const rc = rcpsOf(a.id);
    acRows.push([teamName(a.team), a.date, a.type, a.start, a.end, a.hours, a.place, (a.attendees || []).join(', '), (a.attendees || []).length, a.topic, a.content, a.next, a.writer, filesOf('A:' + a.id).length, rc.length, sum(rc.map((r) => r.amount))]);
  });
  const atRows = [['팀', '이름', '자율스터디 참석', '기록 시간', '인정 시간(목표 횟수까지 × 회당 시간)']];
  d.teams.forEach((t) => attendance(t.id).forEach((x) => atRows.push([t.name, x.name, x.count, Math.round(x.hours * 100) / 100, Math.min(x.count, set.studyGoal) * set.studyHours])));

    { name: '영수증', rows: rcRows, widths: [10, 12, 26, 12, 18, 11, 22, 11, 11, 10, 10, 22, 10, 18, 8, 22], money: [7] },
    { name: '활동 기록', rows: acRows, widths: [10, 12, 10, 7, 7, 7, 16, 26, 9, 26, 50, 36, 10, 8, 9, 12], money: [15] },
    { name: '자율스터디 참석', rows: atRows, widths: [10, 12, 14, 12, 30] }

async function printTeam(id) {
  const d = D();
  const teams = id === 'all' ? d.teams : d.teams.filter((t) => t.id === id);
  const p = document.createElement('div');
  p.id = 'print';
  let html = '';
  const actOf = new Map(d.acts.map((a) => [a.id, a]));
  const actTxt = (r) => { const a = actOf.get(r.actId); return a ? fmtD(a.date) + ' ' + esc(a.topic) : ''; };
  teams.forEach((t) => {
    const rc = d.rcps.filter((r) => r.team === t.id).sort((a, b) => a.date.localeCompare(b.date));
    const s = teamStats(t.id);
    html += `<section style="break-after:page;page-break-after:always"><h1>${esc(d.settings.courseName)} ${esc(t.name)} 활동지원비 사용 내역</h1>
      <p class="p-meta">${esc(t.project)}, 예산 ${won(s.budget)}, 사용 ${won(s.spent)}, 잔액 ${won(s.remain)} (출력 ${todayStr()})</p>
      <table><thead><tr><th>#</th><th class="nw">사용일</th><th>활동</th><th>사용처</th><th>분류·산 것</th><th class="r nw">금액</th><th>결제</th><th class="nw">상태</th></tr></thead><tbody>
      ${rc.map((r, i) => `<tr><td>${i + 1}</td><td class="nw">${esc(r.date)}</td><td>${actTxt(r)}</td><td>${esc(r.store)}</td><td>${esc([r.category, r.item].filter(Boolean).join(', '))}</td><td class="r nw">${won(r.amount)}</td><td>${esc([r.payer, r.method].filter(Boolean).join(', '))}</td><td class="nw">${STATUS_LABEL[r.status] || esc(r.status)}</td></tr>`).join('')}
      <tr><td colspan="5"><b>합계</b></td><td class="r nw"><b>${won(s.spent)}</b></td><td colspan="2"></td></tr></tbody></table>
      ${rc.map((r, i) => `<div class="p-rcp"><h2>${i + 1}. ${esc(r.date)} ${esc(r.store)} ${won(r.amount)}</h2><p>${esc([r.category, r.item].filter(Boolean).join(', '))}${actOf.get(r.actId) ? ` (활동: ${actTxt(r)})` : ''}</p>
        ${filesOf('R:' + r.id).length ? `<div class="p-imgs">${filesOf('R:' + r.id).map((f) => `<div data-pfull="${esc(f.id)}" data-mime="${esc(f.mime)}"><p>(사진 불러오는 중)</p></div>`).join('')}</div>` : '<p>(사진 없음)</p>'}</div>`).join('')}</section>`;
  });
  p.innerHTML = `<div class="p-bar"><span id="p-prog">사진을 불러오는 중입니다…</span><button class="btn" data-act="doPrint" id="p-go" disabled>인쇄</button><button class="btn" data-act="closePrint">닫기</button></div><div class="p-doc">${html || '<p>영수증이 없습니다.</p>'}</div>`;
  document.body.appendChild(p);
  const boxes = [...p.querySelectorAll('[data-pfull]')];
  let done = 0;
  for (const b of boxes) {
    if (!p.isConnected) return;
    try {
      const url = await getFull(b.dataset.pfull);
      b.innerHTML = b.dataset.mime === 'application/pdf' ? '<p>(PDF 영수증은 따로 인쇄해 주세요)</p>' : `<img src="${url}" alt="영수증">`;
    } catch (e) { b.innerHTML = '<p>(사진을 불러오지 못했습니다)</p>'; }
    done++;
    const pr = $('#p-prog'); if (pr) pr.textContent = `사진 불러오는 중 ${done}/${boxes.length}`;
  }
  await Promise.all([...p.querySelectorAll('img')].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }))));
  const pr = $('#p-prog'); if (pr) pr.textContent = '준비됐습니다. 인쇄를 누르고 「PDF로 저장」을 고르면 파일로도 남길 수 있습니다.';
  const go = $('#p-go'); if (go) go.disabled = false;
}

const ACT = {
  closeSheet: () => closeSheet(),
  askYes: () => { const s = topSheet(); if (s) s._ans = true; closeSheet(); },
  askNo: () => closeSheet(),
  retry: () => { if (st.auth) { st.lastErr = ''; refresh(); } else renderLogin(); },
  retryLogin: () => renderLogin(),
  reload: async () => { await closeAll(); refresh(); },
  home: () => { history.replaceState(null, '', location.pathname + location.search); boot(); },
  logout: () => logout(),
  askLogout: async () => { if (await ask('이 기기에서 나갈까요? 다시 들어오려면 팀 링크나 코드가 필요합니다.', '나가기', true)) logout(); },
  showSetup: () => renderSetup(),
  showSetupAgain: () => { renderSetup(); },
  showConnect: () => renderConnect(),
  copyGs: async () => {
    try { const r = await fetch('Code.gs', { cache: 'no-store' }); if (!r.ok) throw new Error(); await copyText(await r.text(), '스크립트 코드를 복사했습니다. Apps Script에 붙여넣으세요.'); }
    catch (e) { toast('코드를 불러오지 못했습니다. [코드 보기]를 눌러 전체 선택 후 복사해 주세요.', 4500); }
  },
  doSetup: async (el) => {
    const url = ($('#setup-url').value || '').trim(), msg = $('#setup-msg');
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url) && !/^https?:\/\/(127\.0\.0\.1|localhost)/.test(url)) { msg.textContent = '주소가 …/exec 로 끝나는지 확인해 주세요.'; return; }
    msg.textContent = ''; el.disabled = true; el.textContent = '연결하는 중… (최대 30초)';
    st.api = url;
    try {
      busy(true);
      const r = await api('setup', {}, { noAuth: true, tries: 2, timeout: 90000 });
      lsSet(LS.api, url);
      if (r.created) {
        st.auth = { admin: r.adminCode }; lsSet(LS.auth, st.auth);
        app().innerHTML = `<div class="wrap intro"><span class="mark">${stars(3, 3, true)}설정 완료</span><h1>관리자 코드를 적어 두세요</h1>
          <p class="lead">교육팀 관리자 화면에 들어갈 때 쓰는 코드입니다. 구글 시트의 「설정」 탭에도 적혀 있습니다.</p>
          <div class="code-big">${esc(r.adminCode)}</div>
          <p class="lead" style="margin-top:16px">다음으로 [설정] 탭에서 팀원 이름을 넣고, 팀별 안내 문구를 각 팀 단톡방에 보내면 됩니다.</p>
          <button class="btn primary block" data-act="enterAdmin">관리자 화면 열기</button></div>`;
      } else {
        renderLogin('이미 설정된 시트입니다. 관리자 코드로 들어가 주세요(시트 「설정」 탭에 있습니다).', true);
      }
    } catch (e) {
      el.disabled = false; el.textContent = '연결하고 설정 마치기';
      msg.textContent = e.message + (e instanceof NetErr ? ' 배포할 때 액세스 권한을 「모든 사용자」로 했는지, 주소를 끝까지 복사했는지 확인해 주세요.' : '');
    } finally { busy(false); }
  },
  doConnect: async (el) => {
    const url = ($('#conn-url').value || '').trim();
    if (!/^https?:\/\/.+\/exec$/.test(url)) { $('#conn-msg').textContent = '주소가 …/exec 로 끝나는지 확인해 주세요.'; return; }
    st.api = url; lsSet(LS.api, url);
    renderLogin('', true);
  },
  enterAdmin: () => { st.atab = 'set'; refresh(); },
  teamMenu: () => teamMenu(),
  adminMenu: () => adminMenu(),
  tab: (el) => { st.tab = el.dataset.tab; renderTeam(); },
  atab: (el) => { st.atab = el.dataset.tab; renderAdmin(); window.scrollTo(0, 0); },
  af: (el) => { st.af[el.dataset.k] = el.dataset.v; renderAdmin(); },
  newAct: () => openActForm(null),
  openAct: (el) => openAct(el.dataset.id, el.dataset.focus === 'rcps'),
  editAct: (el) => openActForm(D().acts.find((x) => x.id === el.dataset.id)),
  // 보완 요청 받은 영수증: 활동 양식을 열고 그 영수증 양식까지 바로 띄운다
  fixRcp: (el) => { const a = D().acts.find((x) => x.id === el.dataset.id); if (!a) return; openActForm(a); const i = st.form.rcps.findIndex((r) => r.id === el.dataset.rid); if (i >= 0) openRcpSub(i); },
  addSubRcp: () => openRcpSub(-1),
  editSubRcp: (el) => openRcpSub(Number(el.dataset.i)),
  applySubRcp: () => applySubRcp(),
  dropSubRcp: () => dropSubRcp(),
  delAct: async (el) => {
    const id = el.dataset.id, rcs = rcpsOf(id);
    if (D().role === 'team' && rcs.some((r) => r.status === '확인')) { toast('교육팀 확인이 끝난 영수증이 붙어 있어 지울 수 없습니다. 교육팀에 알려 주세요.', 4500); return; }
    if (!(await ask(rcs.length ? `이 활동 기록을 지울까요? 붙은 영수증 ${rcs.length}건과 사진도 함께 지워집니다.` : '이 활동 기록을 지울까요? 사진도 함께 지워집니다.', '삭제', true))) return;
    try {
      busy(true);
      const r = await api('deleteAct', { id: id });
      const gone = new Set((r.rcps || []).concat(rcs.map((x) => x.id)));
      D().acts = D().acts.filter((a) => a.id !== id); D().rcps = D().rcps.filter((x) => !gone.has(x.id));
      setFiles('A:' + id, []); gone.forEach((x) => setFiles('R:' + x, []));
      saveCache(); await closeAll(); render(); toast('삭제했습니다');
    } catch (e) { toast(e.message, 4000); } finally { busy(false); }
  },
  chip: (el) => {
    const f = st.form; if (!f) return;
    f[el.dataset.k] = f[el.dataset.k] === el.dataset.v && el.dataset.k === 'method' ? '' : el.dataset.v;
    el.parentElement.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(f[el.dataset.k] === c.dataset.v)));
    saveDraftSoon();
  },
  toggleAtt: (el) => {
    const f = st.form; if (!f) return;
    const n = el.dataset.v, i = f.attendees.indexOf(n);
    if (i >= 0) f.attendees.splice(i, 1); else f.attendees.push(n);
    el.setAttribute('aria-pressed', String(i < 0));
    saveDraftSoon();
  },
  addAtt: () => {
    const f = st.form, inp = fq('#att-new'); if (!f || !inp) return;
    inp.value.split(',').map((s) => s.trim()).filter(Boolean).forEach((n) => { if (!f.attendees.includes(n)) f.attendees.push(n); });
    inp.value = ''; drawAtt(); saveDraftSoon();
  },
  setPayer: (el) => { const f = st.form; if (!f) return; f.payer = f.payer === el.dataset.v ? '' : el.dataset.v; drawPayer(); saveDraftSoon(); },
  rmPhoto: (el) => {
    const f = st.form; if (!f) return;
    const p = f.files.splice(Number(el.dataset.i), 1)[0];
    if (p && !p.isNew) f.remove.push(p.id);
    drawPhotos();
  },
  clearDraft: async () => { lsSet(LS.dAct, null); await closeSheet(); openActForm(null); },
  saveAct: () => saveAct(),
  view: (el) => viewPhoto(el.dataset.id),
  closeViewer: () => { if (history.state && history.state.viewer) history.back(); else { const v = $('#viewer'); if (v) v.remove(); } },
  saveMembers: async (el) => {
    const v = $('#members-in').value;
    el.disabled = true;
    try { busy(true); const r = await api('saveMembers', { members: v.split(/[,\n]/) }); D().team.members = r.members; saveCache(); toast('팀원을 저장했습니다'); }
    catch (e) { toast(e.message, 4000); } finally { el.disabled = false; busy(false); }
  },
  copyMyLink: () => {
    const t = Object.assign({}, D().team, { code: st.auth.code });
    copyText(`[${D().settings.courseName || 'AI프론티어'}] ${t.name} 활동 기록 링크\n${teamLink(t)}`, '우리 팀 링크를 복사했습니다');
  },
  teamDetail: (el) => teamDetail(el.dataset.id),
  copyLink: (el) => { const t = teamOf(el.dataset.id); copyText(teamLink(t), t.name + ' 링크를 복사했습니다'); },
  copyGuide: (el) => { const t = teamOf(el.dataset.id); copyText(guideText(t), t.name + ' 안내 문구를 복사했습니다'); },
  newTeamCode: (el) => {
    const inp = el.parentElement.querySelector('input');
    const taken = [...document.querySelectorAll('#teams-form input[name="code"]')].map((i) => i.value.trim());
    inp.value = newCode(taken);
  },
  saveTeams: async (el) => {
    const teams = [...document.querySelectorAll('#teams-form .set-team')].map((box) => {
      const g = (n) => box.querySelector(`[name="${n}"]`).value;
      return { id: box.dataset.team, name: g('name').trim(), project: g('project').trim(), budget: g('budget').replace(/\D/g, ''), code: g('code').trim(), members: g('members').split(/[,\n]/) };
    });
    el.disabled = true;
    try { busy(true); const r = await api('saveTeams', { teams: teams }); D().teams = r.teams; saveCache(); render(); toast('팀 설정을 저장했습니다'); }
    catch (e) { toast(e.message, 4500); el.disabled = false; } finally { busy(false); }
  },
  saveSettings: async (el) => {
    const s = { openActs: $('#set-open').checked ? 'Y' : 'N', studyGoal: $('#set-goal').value, studyHours: $('#set-hours').value, courseName: $('#set-course').value };
    el.disabled = true;
    try { busy(true); const r = await api('saveSettings', { settings: s }); D().settings = r.settings; saveCache(); render(); toast('저장했습니다'); }
    catch (e) { toast(e.message, 4500); el.disabled = false; } finally { busy(false); }
  },
  saveAdminCode: async (el) => {
    const code = $('#set-admin').value.trim();
    if (!/^[0-9A-Za-z]{4,12}$/.test(code)) { toast('4~12자리 숫자·영문으로 넣어 주세요.'); return; }
    if (!(await ask(`관리자 코드를 ${code} 로 바꿀까요?`, '바꾸기'))) return;
    el.disabled = true;
    try { busy(true); await api('saveSettings', { settings: { adminCode: code } }); st.auth = { admin: code }; lsSet(LS.auth, st.auth); saveCache(); toast('관리자 코드를 바꿨습니다'); $('#set-admin').value = ''; }
    catch (e) { toast(e.message, 4500); } finally { el.disabled = false; busy(false); }
  },
  review: async (el) => {
    const id = el.dataset.id, s = el.dataset.s;
    const inp = document.getElementById('rv-' + id);
    const note = inp ? inp.value : '';
    if (s === '보완요청' && !note.trim()) { toast('무엇을 보완할지 메모 칸에 적어 주세요.'); if (inp) inp.focus(); return; }
    el.disabled = true;
    const cur = D().rcps.find((x) => x.id === id) || {};
    const sendNote = s === '확인' && (!note.trim() || note === cur.reviewNote) ? '' : note; // 예전 보완 메모를 확인 메모로 남기지 않음
    try { busy(true); const r = await api('review', { id: id, status: s, note: sendNote }); upsert(D().rcps, r.rcp); saveCache(); render(); rerenderSheets(); toast(s === '확인' ? '확인 완료로 바꿨습니다' : s === '보완요청' ? '보완 요청을 보냈습니다' : '확인 대기로 되돌렸습니다'); }
    catch (e) { toast(e.message, 4500); el.disabled = false; } finally { busy(false); }
  },
  exportXlsx: async () => { await closeAll(); exportXlsx(); },
  printTeam: async (el) => { await closeAll(); printTeam(el.dataset.id); },
  doPrint: () => window.print(),
  closePrint: () => { const p = $('#print'); if (p) p.remove(); }
};
document.addEventListener('click', (e) => {
  const lab = e.target.closest('label[data-pick]');
  if (lab) {
    if (!st.form || st.form.files.length >= MAX_FILES) { e.preventDefault(); toast('사진은 한 건에 ' + MAX_FILES + '장까지 올릴 수 있습니다.'); }
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target, f = st.form;
  if (!f || !el.dataset || !el.dataset.f) return;
  const k = el.dataset.f;
  if (k === 'amount') {
    const digits = el.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    f.amount = digits;
    el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  } else {
    f[k] = el.value;
    if (k === 'start' || k === 'end') updHours();
    if (k === 'payer') drawPayer();
    if (k === 'date' && f.kind === 'rcp') f.dateAuto = false; // 손으로 바꾼 사용일은 활동 날짜를 따라가지 않음
    if (k === 'date' && f.kind === 'act') drawRcps();
  }
  saveDraftSoon();
});
document.addEventListener('change', (e) => {
  const el = e.target, f = st.form;
  if (f && el.dataset && el.dataset.f && el.tagName === 'SELECT') { f[el.dataset.f] = el.value; saveDraftSoon(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'att-new') { e.preventDefault(); ACT.addAtt(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('label[data-pick]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') { if ($('#viewer')) ACT.closeViewer(); else if ($('#print')) ACT.closePrint(); else closeSheet(); }
});
$('#pick-cam').addEventListener('change', onPicked);
$('#pick-file').addEventListener('change', onPicked);

/* ───────── 시작 ───────── */
function boot() {
  st.api = lsGet(LS.api, '') || HOME_API;
  st.auth = lsGet(LS.auth, null);
  const h = new URLSearchParams(location.hash.slice(1));
  const short = SHORT_LINK.exec(location.hash.slice(1)); // 짧은 팀 링크 #A1-123456
  let mode = '';
  if (location.hash.length > 1) {
    const api = apiFromLink(h);
    if (api) { st.api = api; lsSet(LS.api, api); }
    if (short) { st.auth = { team: short[1], code: short[2] }; lsSet(LS.auth, st.auth); lsSet(LS.cache, null); }
    else if (h.get('t') && h.get('k')) { st.auth = { team: h.get('t'), code: h.get('k') }; lsSet(LS.auth, st.auth); lsSet(LS.cache, null); }
    if (h.has('admin')) mode = 'admin';
    if (h.has('setup')) mode = 'setup';
    history.replaceState(null, '', location.pathname + location.search); // 코드가 주소창에 남지 않게
  }
  if (mode === 'setup') { renderSetup(); return; }
  if (!st.api) { renderWelcome(); return; }
  if (mode === 'admin' && !(st.auth && st.auth.admin)) { renderLogin('', true); return; }
  if (!st.auth) { renderLogin(); return; }
  const cache = lsGet(LS.cache, null);
  if (cache && cache.key === JSON.stringify(st.auth) && cache.data) { st.data = cache.data; render(); refresh(true); }
  else { app().innerHTML = `<div class="wrap intro"><span class="mark">${stars(3, 3, true)}AI프론티어 팀 기록</span><h1>불러오는 중…</h1><p class="lead">처음에는 구글 서버 응답이 조금 늦을 수 있습니다.</p></div>`; refresh(); }
}
window.addEventListener('hashchange', () => {
  // 같은 탭에서 다른 팀 링크를 누른 경우(주소 뒤 # 만 바뀜)
  if (!/[#&](t|k|s|api)=|[#&](admin|setup)(&|$)/.test(location.hash) && !SHORT_LINK.test(location.hash.slice(1))) return;
  while (sheets.length) popSheet();
  st.data = null;
  boot();
});
boot();
</script>
